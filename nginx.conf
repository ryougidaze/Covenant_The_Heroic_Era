# =============================================================================
# Nginx Configuration — 圣约·英雄时代 (Covenant: Age of Heroes)
# Target: Alibaba Cloud ECS
# =============================================================================
#
# Prerequisites:
#   Brotli module: yum install nginx-module-brotli  (or build nginx with --add-module=ngx_brotli)
#   If Brotli is unavailable, the config falls back to Gzip only.
#
# SSL certificate paths — update these with your actual cert paths:
#   ssl_certificate     /etc/nginx/ssl/fullchain.pem;
#   ssl_certificate_key /etc/nginx/ssl/privkey.pem;
# =============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ── Basic settings ──
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ──
    access_log /var/log/nginx/covenant-access.log combined buffer=16k;
    error_log  /var/log/nginx/covenant-error.log warn;

    # ── Gzip Compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/x-javascript
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf
        font/woff2;

    # ── Brotli Compression (requires ngx_brotli module) ──
    # Uncomment if brotli module is installed:
    # brotli on;
    # brotli_comp_level 6;
    # brotli_static on;
    # brotli_types
    #     text/plain
    #     text/css
    #     text/xml
    #     text/javascript
    #     application/javascript
    #     application/json
    #     application/xml
    #     application/x-javascript
    #     image/svg+xml;

    # ── Rate limiting zone ──
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # ── Upstream to Next.js (running on localhost:3000) ──
    upstream nextjs {
        server 127.0.0.1:3000;
        keepalive 64;
    }

    # ── HTTP → HTTPS redirect ──
    server {
        listen 80;
        listen [::]:80;
        server_name your-domain.com www.your-domain.com;

        # Let's Encrypt verification
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS server ──
    server {
        # HTTP/2 enabled (requires nginx >= 1.25: "http2" in listen directive)
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        server_name your-domain.com www.your-domain.com;

        # ── SSL ──
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ── Security headers ──
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Connection limits ──
        limit_conn conn 20;

        # ── Static assets: long cache ──
        # JS/CSS bundles (hashed filenames — immutable)
        location /_next/static/ {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache STATIC;
            proxy_cache_valid 200 365d;
            proxy_cache_use_stale error timeout updating;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ── Images: moderate cache, auto WebP negotiation ──
        location ~* \.(webp|avif|jpg|jpeg|png|svg|ico|gif)$ {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_cache IMAGES;
            proxy_cache_valid 200 30d;
            proxy_cache_use_stale error timeout updating;
            add_header Cache-Control "public, max-age=2592000, must-revalidate";
            add_header Vary Accept;
        }

        # ── Fonts: immutable cache ──
        location ~* \.(woff2|woff|ttf|otf|eot)$ {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            proxy_cache STATIC;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ── Audio: moderate cache ──
        location ~* \.(mp3|wav|ogg|flac)$ {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            proxy_cache STATIC;
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # ── JSON data: short cache, must-revalidate ──
        location ~* \.json$ {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;

            # Gzip JSON aggressively
            gzip on;
            gzip_comp_level 9;
            gzip_min_length 100;
            gzip_types application/json;

            add_header Cache-Control "public, max-age=3600, must-revalidate";
        }

        # ── HTML pages: no cache (dynamic content) ──
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Rate limiting on dynamic requests
            limit_req zone=api burst=20 nodelay;

            add_header Cache-Control "no-cache, must-revalidate";
        }
    }

    # ── Proxy cache definitions ──
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=STATIC:50m max_size=500m inactive=365d use_temp_path=off;
    proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=IMAGES:50m max_size=1g inactive=30d use_temp_path=off;
}
